<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spirographe numérique</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  </head>
  <body>
    <main>
      <p class="subtitle">INSPIRED BY THE CLASSIC SPIROGRAPH</p>
      <div class="tv-conteiner">
        <div class="tv-content">
          <img src="assets/img/bg-decore-tv-starter.svg" alt="tv-decores">
          <section class="tv-info">
            <p class="subtitle">
              <span>></span> 
              MECHANICAL DRAWING MACHINE_
            </p>
            <h1>spirograph</h1>
            <button class="start"><a href="#">start drawing</a></button>
          </section>
        </div>
      </div>
      <div class="tv-live-card">
        <div class="header">
          LIVE PREVIEW
          <div class="indicator"></div>
        </div>
        <div class="content">
          <img src="assets/img/bg-live-starter.svg" alt="img-live">
        </div>
      </div>
      <section><p class="subtitle">Your new favourite way to waste time beautifully</p></section>
      <div class="loader-card">
        <p class="subtitle">
          Loading
        </p>
        <div class="loader"></div>
      </div>
    </main>
    

    <script src="js/main.js" type="module"></script>
  </body>
</html>
